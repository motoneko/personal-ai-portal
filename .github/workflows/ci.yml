name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run build
      - run: go test ./...
      - run: python3 -m unittest discover -s deploy/security -p "test_*.py"
      - run: go build -o /tmp/portal .
      - run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        run: |
          PORTAL_DB=/tmp/portal-test.db PORTAL_LISTEN=127.0.0.1:8090 PORTAL_ORIGIN=http://127.0.0.1:8090 PORTAL_SECURE_COOKIE=false PORTAL_PASSWORD=preview-only-password-not-for-production /tmp/portal &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/portal-api/health; then break; fi
            sleep 1
          done
          npm run test:ui
          npm run test:drawing
